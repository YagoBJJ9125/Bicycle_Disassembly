name: Verifica progetto
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:init
      - run: npm run check:catalog
      - run: npm run check:model -- models/fastener-example-v1/web/assembly.glb models/fastener-example-v1/catalog.json fastener-example-v1
      - run: npm run check:types
      - run: npm run build
